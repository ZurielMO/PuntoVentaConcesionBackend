name: Backend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Run tests
        working-directory: functions
        env:
          TZ: UTC
          PROJECT_ID: demo-puntoventa-test
        run: npm test -- --passWithNoTests --ci --forceExit

      - name: Build
        run: |
          cd functions
          npm run build

  deploy:
    name: Deploy Firebase Functions
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Stamp build info
        # Lo sirve el health (GET /apiV2) para saber qué commit corre en producción.
        # Va en un JSON propio y no en `functions/.env`: un .env en el deploy
        # reemplazaría las variables de entorno ya configuradas en la function.
        run: |
          node -e "require('fs').writeFileSync('functions/build-info.json', JSON.stringify({ commit: process.env.GITHUB_SHA ?? null, builtAt: new Date().toISOString() }, null, 2) + '\n')"
          cat functions/build-info.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Show deploy identity
        run: |
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('Deploy SA:', j.client_email);"

      - name: Deploy Cloud Functions
        # Solo apiV2 (Gen2). No usar --only functions mientras Gen1 `api` siga en el proyecto:
        # en non-interactive el CLI aborta al detectar functions huérfanas.
        # El SA necesita roles/secretmanager.viewer + secretAccessor sobre
        # SERVICE_ACCOUNT_APP_OFICIAL2. Si vuelve el 403:
        #   node scripts/grant-ci-secret-manager-access.mjs
        run: npx firebase-tools@latest deploy --only functions:apiV2 --project puntoventacl --non-interactive
