name: Backend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Run tests
        run: |
          cd functions
          npm test -- --passWithNoTests

      - name: Build
        run: |
          cd functions
          npm run build

  deploy:
    name: Deploy Firebase Functions
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Functions
        # Solo apiV2 (Gen2). No usar --only functions mientras Gen1 `api` siga en el proyecto:
        # en non-interactive el CLI aborta al detectar functions huérfanas.
        run: npx firebase-tools@latest deploy --only functions:apiV2 --project puntoventacl --non-interactive
